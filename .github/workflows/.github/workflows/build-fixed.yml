      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DGTPROXY_BUILD_VERSION=${{github.run_number}}

      - name: Build
        run: cmake --build build --config Debug

      - name: Package everything
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Copy-Item -Recurse -Force "build/src/Debug/*" output/
          Get-ChildItem build/conan/build -Filter *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination output/
          Copy-Item -Recurse -Force resources output/
          New-Item -ItemType Directory -Force -Path output/scripts | Out-Null
          Copy-Item "scripts/*.lua" output/scripts/ -Exclude "test_*.lua"
          Remove-Item output/*.pdb, output/*.ilk -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse output | Select-Object -ExpandProperty FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: GTProxy-with-logs
          path: output

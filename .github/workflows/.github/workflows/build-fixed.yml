name: Build fixed (Debug)

# Builds GTProxy as a Debug build, fixes the renamed event functions that break the
# newest upstream commit, adds proxy_logs.lua and uploads one zip with everything.
# It starts by itself when this file is committed, and can also be run by hand.

on:
  push:
    paths:
      - '.github/workflows/build-fixed.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Install conan
        run: pip install "conan>2.0"

      - name: Fix renamed event functions
        shell: pwsh
        run: |
          function Fix($path, $old, $new) {
            $full = [System.IO.Path]::Combine($env:GITHUB_WORKSPACE, $path)
            $text = [System.IO.File]::ReadAllText($full)
            if (-not $text.Contains($old)) {
              Write-Host "Skipping $path : '$old' not found (already fixed?)"
              return
            }
            $utf8 = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($full, $text.Replace($old, $new), $utf8)
            Write-Host "Fixed $path : $old -> $new"
          }
          Fix "src/scripting/script_event_bridge.cpp" "dispatcher_.removeListener(" "dispatcher_.remove_listener("
          Fix "src/scripting/script_event_bridge.cpp" "dispatcher_.appendListener(" "dispatcher_.append_listener("
          Fix "src/core/web_server.cpp" "dispatcher_.appendListener(" "dispatcher_.append_listener("

